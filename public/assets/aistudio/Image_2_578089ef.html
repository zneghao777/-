<!-- 原生轻量JS交互 -->
<script>
    // 1. 鼠标动态跟随光斑 (Vanilla JS + CSS custom properties)
    const glowLayer = document.getElementById('mouseGlowLayer');
    const card = document.getElementById('interactiveCard');

    window.addEventListener('mousemove', (e) => {
      const x = e.clientX;
      const y = e.clientY;
      
      // 更新全局柔和跟随光晕位置
      glowLayer.style.setProperty('--mouse-x', `${x}px`);
      glowLayer.style.setProperty('--mouse-y', `${y}px`);

      // 细腻的卡片微视差互动
      if (window.innerWidth >= 1024 && card) {
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;
        const deltaX = (x - centerX) / 80;
        const deltaY = (y - centerY) / 80;
        card.style.transform = `perspective(1000px) rotateY(${deltaX * 0.4}deg) rotateX(${-deltaY * 0.4}deg) translateY(0px)`;
      }
    });

    // 鼠标离开窗口恢复中性位置
    window.addEventListener('mouseleave', () => {
      if (card) {
        card.style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg)';
      }
    });

    // 2. 密码可见性切换
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        togglePasswordBtn.classList.toggle('text-sky-600', isPassword);
      });
    }

    // 3. 语言切换交互胶囊
    const langPills = document.querySelectorAll('.lang-pill');
    langPills.forEach(pill => {
      pill.addEventListener('click', () => {
        langPills.forEach(p => {
          p.classList.remove('bg-white', 'text-sky-700', 'shadow-sm', 'border-slate-200/60', 'font-semibold');
          p.classList.add('text-slate-600', 'font-medium');
          const dot = p.querySelector('span');
          if (dot) dot.remove();
        });
        pill.classList.add('bg-white', 'text-sky-700', 'shadow-sm', 'border-slate-200/60', 'font-semibold');
        pill.classList.remove('text-slate-600', 'font-medium');
        
        const dot = document.createElement('span');
        dot.className = 'w-1.5 h-1.5 rounded-full bg-sky-600';
        pill.prepend(dot);
      });
    });
  </script>
